# Админка правит data/*.json. Здесь index.html пересобирается из этих данных
# и коммитится обратно в main, после чего GitHub Pages публикует сайт.
name: render-site
on:
  push:
    branches: [main]
    paths: ["data/**", "render.py"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 render.py
      - name: Commit index.html
        run: |
          if git diff --quiet index.html; then echo "без изменений"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Сайт: пересборка прайса из data/services.json"
          git push
